[workspace]

[workspace.package]
publish = false
edition = "2024"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "cbffa0f5e1fc4a05b43c3e29d0c759b5d24d0f8f", default-features = false }
collections = { git = "https://github.com/zed-industries/zed.git", rev = "cbffa0f5e1fc4a05b43c3e29d0c759b5d24d0f8f" }
anyhow = "1.0.86"
block = "0.1"
cocoa = "=0.26.0"
core-foundation = "0.10"
core-video = { version = "0.5.2", features = ["metal"] }
derive_more = { version = "2.1.1", features = [
    "add",
    "add_assign",
    "deref",
    "deref_mut",
    "display",
    "from",
    "from_str",
    "mul",
    "mul_assign",
    "not",
] }
etagere = "0.2"
foreign-types = "0.5"
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
] }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
parking_lot = "0.12.1"

[package]
name = "gpui_apple"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_apple.rs"

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block.workspace = true
cocoa.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-video.workspace = true
derive_more.workspace = true
etagere.workspace = true
foreign-types.workspace = true
image.workspace = true
log.workspace = true
metal.workspace = true
objc.workspace = true
objc2.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
