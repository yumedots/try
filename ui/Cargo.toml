[package]
name = "try-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
async-std = "1.12"
async-trait = "0.1"
core-foundation = "0.10"
core-video = { version = "0.5.2", features = ["metal"] }
gpui = { git = "https://github.com/yumedots/gpui.git", rev = "f2571b5563f425fd8cb9ba8d8d804856a7e2d24d" }
gpui_platform = { git = "https://github.com/yumedots/gpui.git", rev = "f2571b5563f425fd8cb9ba8d8d804856a7e2d24d", features = ["font-kit"] }
image = "0.25"
objc = "0.2"
serde_bytes = "0.11"
smallvec = "1"
zbus = { version = "5", features = ["p2p", "serde_bytes"] }

[dev-dependencies]
gpui_apple = { git = "https://github.com/yumedots/gpui.git", rev = "f2571b5563f425fd8cb9ba8d8d804856a7e2d24d", features = ["test-support"] }
